name: Deploy Objektív24 shutdown page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload shutdown site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy shutdown site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public shutdown
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 https://objektiv24.sk/ || true)"
            if printf '%s' "$body" | grep -Fq "Prevádzka spravodajského webového portálu bola ukončená"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Shutdown page was not visible on objektiv24.sk"
          exit 1
