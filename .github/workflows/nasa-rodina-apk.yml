name: Build Nasa rodina APK

on:
  push:
    branches:
      - nasa-rodina-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Recreate app source
        shell: bash
        run: |
          rm -rf /tmp/nasa-rodina-build
          mkdir -p /tmp/nasa-rodina-build
          echo '' | base64 -d > /tmp/nasa-rodina-build/project.zip
          unzip -q /tmp/nasa-rodina-build/project.zip -d /tmp/nasa-rodina-build
          test -f /tmp/nasa-rodina-build/nasa-rodina-app/package.json

      - name: Install dependencies
        working-directory: /tmp/nasa-rodina-build/nasa-rodina-app
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: /tmp/nasa-rodina-build/nasa-rodina-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: /tmp/nasa-rodina-build/nasa-rodina-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nasa-rodina.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nasa-rodina-APK
          path: Nasa-rodina.apk
          if-no-files-found: error
          retention-days: 7
