name: Objektív24 evergreen source check

on:
  schedule:
    - cron: "40 4,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evergreen-check.yml"
      - "scripts/check-evergreen-sources.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: objektiv24-evergreen-source-check
  cancel-in-progress: true

jobs:
  evergreen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate checker
        run: node --check scripts/check-evergreen-sources.mjs

      - name: Check official evergreen sources
        run: node scripts/check-evergreen-sources.mjs
