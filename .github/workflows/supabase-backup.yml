name: Objektiv24 encrypted Supabase backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: objektiv24-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_PROJECT_REF: bkyappgttwjxakkwycub
      STORAGE_BUCKET: article-images

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL"
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_PASSPHRASE"
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" == *"[YOUR-PASSWORD]"* || "$SUPABASE_DB_URL" == *"%5BYOUR-PASSWORD%5D"* ]]; then
            echo "::error::SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder. Replace it with the actual database password."
            exit 1
          fi

      - name: Set backup timestamp
        id: meta
        shell: bash
        run: echo "stamp=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare backup directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/db "backup/storage/${STORAGE_BUCKET}"

      - name: Dump database roles, schema and data
        shell: bash
        run: |
          set -euo pipefail
          db_url="$SUPABASE_DB_URL"
          if [[ "$db_url" == *"pooler.supabase.com"* && "$db_url" == *"://postgres:"* ]]; then
            db_url="${db_url/\/\/postgres:/\/\/postgres.${SUPABASE_PROJECT_REF}:}"
          fi

          supabase db dump --db-url "$db_url" -f backup/db/roles.sql --role-only
          supabase db dump --db-url "$db_url" -f backup/db/schema.sql
          supabase db dump --db-url "$db_url" -f backup/db/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

      - name: Export Storage manifest
        shell: bash
        run: |
          set -euo pipefail
          db_url="$SUPABASE_DB_URL"
          if [[ "$db_url" == *"pooler.supabase.com"* && "$db_url" == *"://postgres:"* ]]; then
            db_url="${db_url/\/\/postgres:/\/\/postgres.${SUPABASE_PROJECT_REF}:}"
          fi

          psql "$db_url" -v ON_ERROR_STOP=1 -Atc \
            "select name from storage.objects where bucket_id = '${STORAGE_BUCKET}' order by name" \
            > backup/storage-manifest.txt

      - name: Download public Storage objects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          bucket = os.environ["STORAGE_BUCKET"]
          manifest = pathlib.Path("backup/storage-manifest.txt")
          root = pathlib.Path("backup/storage") / bucket

          names = [line.rstrip("\n") for line in manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          for name in names:
              rel = pathlib.PurePosixPath(name)
              if rel.is_absolute() or ".." in rel.parts:
                  raise RuntimeError(f"Unsafe Storage object path: {name!r}")

              target = root.joinpath(*rel.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              encoded = urllib.parse.quote(name, safe="/")
              url = f"https://{project_ref}.supabase.co/storage/v1/object/public/{bucket}/{encoded}"

              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Objektiv24-backup/1.0"})
                      with urllib.request.urlopen(req, timeout=60) as src, target.open("wb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(attempt * 2)

              if last_error is not None:
                  raise RuntimeError(f"Failed to back up {name!r}: {last_error}")

          print(f"Downloaded {len(names)} Storage objects.")
          PY

      - name: Create backup metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          manifest = pathlib.Path("backup/storage-manifest.txt")
          object_count = len([x for x in manifest.read_text(encoding="utf-8").splitlines() if x.strip()])
          metadata = {
              "project_ref": os.environ["SUPABASE_PROJECT_REF"],
              "storage_bucket": os.environ["STORAGE_BUCKET"],
              "storage_object_count": object_count,
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "format_version": 1,
          }
          pathlib.Path("backup/backup-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          find backup -type f -print0 | sort -z | xargs -0 sha256sum > backup/SHA256SUMS

      - name: Archive and encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          archive="objektiv24-backup-${{ steps.meta.outputs.stamp }}.tar.gz"
          encrypted="${archive}.gpg"

          tar -czf "$archive" backup

          printf '%s' "$BACKUP_PASSPHRASE" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "$encrypted" \
            "$archive"

          rm -rf backup "$archive"
          test -s "$encrypted"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: objektiv24-backup-${{ steps.meta.outputs.stamp }}
          path: objektiv24-backup-${{ steps.meta.outputs.stamp }}.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
