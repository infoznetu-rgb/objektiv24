name: Automatické články Objektív24

on:
  schedule:
    - cron: "12 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: objektiv24-auto-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OLLAMA_MODEL: qwen3:4b-instruct
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models

    steps:
      - name: Check daily publication cap
        id: cap
        env:
          INGEST_URL: https://bkyappgttwjxakkwycub.supabase.co/functions/v1/github-article-ingest
        run: |
          set -euo pipefail
          echo "Kontrolujem limit publikovania pred spustením AI."
          if ! TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=objektiv24-auto-articles")"; then
            echo "::warning::OIDC pre-check zlyhal; automatiku radšej spustím."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | jq -r '.value // empty')"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::warning::OIDC token chýba; automatiku radšej spustím."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! STATUS="$(curl -fsS -X POST "$INGEST_URL"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"action":"status"}')"; then
            echo "::warning::Stav publikovania sa nepodarilo načítať; automatiku radšej spustím."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(printf '%s' "$STATUS" | jq -r '.published_last_24h // 0')"
          CAP="$(printf '%s' "$STATUS" | jq -r '.daily_cap // 9')"
          echo "Za posledných 24 h: $COUNT / $CAP"
          if [ "$COUNT" -ge "$CAP" ]; then
            echo "Denný limit je naplnený; tento dvojhodinový beh končí bez spúšťania AI."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cap.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Cache Ollama model
        if: steps.cap.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .ollama-models
          key: objektiv24-ollama-qwen25-3b-v2

      - name: Install Ollama
        if: steps.cap.outputs.run == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          pkill -x ollama || true
          mkdir -p "${OLLAMA_MODELS}"
          nohup env OLLAMA_MODELS="${OLLAMA_MODELS}" ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Prepare Slovak editorial model
        if: steps.cap.outputs.run == 'true'
        run: ollama pull "${OLLAMA_MODEL}"

      - name: Install Slovak spell checker
        if: steps.cap.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hunspell hunspell-sk

      - name: Validate automation script
        if: steps.cap.outputs.run == 'true'
        run: node --check scripts/auto-articles.mjs

      - name: Generate and publish
        if: steps.cap.outputs.run == 'true'
        run: node scripts/auto-articles.mjs

      - name: Ollama diagnostics on failure
        if: failure() && steps.cap.outputs.run == 'true'
        run: |
          echo "=== Ollama log ==="
          tail -n 200 /tmp/ollama.log || true
